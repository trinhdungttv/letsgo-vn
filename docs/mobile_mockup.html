/* ─── menu registry: đúng các trang trong app thật ─── */
const MENU = [
  { id: 'reports',   label: 'Báo cáo',     icon: 'report' },
  { id: 'dashboard', label: 'Dashboard',   icon: 'home' },
  { id: 'clients',   label: 'Khách hàng',  icon: 'users' },
  { id: 'workspace', label: 'Workspace',   icon: 'work' },
  { id: 'branches',  label: 'Chi nhánh',   icon: 'branch' },
  { id: 'finance',   label: 'Tài chính',   icon: 'finance' },
  { id: 'market',    label: 'Thị trường',  icon: 'market' },
  { id: 'loans',     label: 'Khoản vay',   icon: 'loan' },
  { id: 'history',   label: 'Lịch sử',     icon: 'history' },

const menuOf = id => MENU.find(m => m.id === id);

/* ═══════════ Trang Báo cáo — bản mobile ═══════════ */
function KpiCard({ label, value, badge, badgeTone, sub, sub2, bar }) {
  const tones = {
    blue:  { bg: '#E6F1FB', tx: '#1D4ED8' }, green: { bg: '#E1F5EE', tx: '#065F46' },
    red:   { bg: '#FCEBEB', tx: '#991B1B' }, purple:{ bg: '#EEEDFE', tx: '#3C3489' },
  }[badgeTone || 'blue'];
  return (
    <div style={{ background: '#fff', border: `1px solid ${C.border}`, borderRadius: 14, padding: '12px 13px' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 4 }}>
        <span style={{ fontSize: 11, color: C.mut, whiteSpace: 'nowrap' }}>{label}</span>
        {badge && <span style={{ fontSize: 9.5, fontWeight: 600, color: tones.tx, background: tones.bg, padding: '2px 7px', borderRadius: 9, whiteSpace: 'nowrap' }}>{badge}</span>}
      </div>
      <div style={{ fontSize: 22, fontWeight: 700, color: C.text, marginTop: 4, letterSpacing: '-0.02em' }}>{value}</div>
      {bar !== undefined && (
        <div style={{ height: 4, background: C.border, borderRadius: 2, marginTop: 8, overflow: 'hidden' }}>
          <div style={{ width: `${bar}%`, height: '100%', background: C.blue, borderRadius: 2 }} />
        </div>
      )}
      {sub && <div style={{ fontSize: 10, color: C.mut, marginTop: 5 }}>{sub}</div>}
      {sub2 && <div style={{ fontSize: 10, color: C.green, marginTop: 2 }}>{sub2}</div>}
    </div>
  );
}

function RevenueChart() {
  const bars = [42, 48, 51, 55, 54, 62];
  const profit = [30, 38, 40, 46, 46, 50];
  const W = 320, H = 130, bw = 26, gap = (W - 6 * bw) / 7;
  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H + 22}`}>
      {[0.25, 0.5, 0.75, 1].map(f => (
        <line key={f} x1="0" x2={W} y1={H - H * f} y2={H - H * f} stroke={C.grid} strokeWidth="1" />
      ))}
      {bars.map((v, i) => {
        const x = gap + i * (bw + gap);
        return <rect key={i} x={x} y={H - (v / 70) * H} width={bw} height={(v / 70) * H} rx="4" fill={i === 5 ? C.blue : '#B5D4F4'} />;
      })}
      <polyline fill="none" stroke={C.green} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
        points={profit.map((v, i) => `${gap + i * (bw + gap) + bw / 2},${H - (v / 70) * H}`).join(' ')} />
      {profit.map((v, i) => (
        <circle key={i} cx={gap + i * (bw + gap) + bw / 2} cy={H - (v / 70) * H} r="3" fill={C.green} stroke="#fff" strokeWidth="1.5" />
      ))}
      {['T2', 'T3', 'T4', 'T5', 'T6', 'T7'].map((l, i) => (
        <text key={l} x={gap + i * (bw + gap) + bw / 2} y={H + 16} textAnchor="middle" fontSize="10" fill={C.mut2} fontFamily="Inter">{l}</text>
      ))}
    </svg>
  );
}

function Card({ title, right, children, pad = true }) {
  return (
    <div style={{ background: '#fff', border: `1px solid ${C.border}`, borderRadius: 14, overflow: 'hidden' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', padding: '12px 14px 0' }}>
        <div style={{ fontSize: 12.5, fontWeight: 600, color: C.text }}>{title}</div>
        {right}
      </div>
      <div style={{ padding: pad ? '8px 14px 13px' : '8px 0 0' }}>{children}</div>
    </div>
  );
}

/* ═══════════ Bottom Nav ═══════════ */
function BottomNav({ pinned, active, onTab, onMore, moreActive }) {
  return (
    <div style={{
      display: 'flex', background: 'rgba(255,255,255,0.96)', backdropFilter: 'blur(16px)',
      borderTop: `1px solid ${C.border}`, padding: '6px 4px 4px', flexShrink: 0,
    }}>
      {pinned.map(id => {
        const m = menuOf(id);
        const isActive = active === id && !moreActive;
        return (
          <button key={id} onClick={() => onTab(id)} style={{
            flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3,
            padding: '5px 0 4px', background: 'none', border: 'none', cursor: 'pointer',
            color: isActive ? C.blue : '#8B8A85', transition: 'color 0.15s',
          }}>
            <Ic d={icons[m.icon]} size={21} sw={isActive ? 2.1 : 1.7} />
            <span style={{ fontSize: 9.5, fontWeight: isActive ? 600 : 500 }}>{m.label}</span>
          </button>
        );
      })}
      <button onClick={onMore} style={{
        flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3,
        padding: '5px 0 4px', background: 'none', border: 'none', cursor: 'pointer',
        color: moreActive ? C.blue : '#8B8A85',
      }}>
        <Ic d={icons.more} size={21} sw={2.2} />
        <span style={{ fontSize: 9.5, fontWeight: 500 }}>Thêm</span>
      </button>
    </div>
  );
}

/* ═══════════ Drawer ⋯ (bottom sheet) ═══════════ */
function MoreDrawer({ open, pinned, onClose, onNavigate, onCustomize }) {
  const rest = MENU.filter(m => !pinned.includes(m.id));
  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 30,
      pointerEvents: open ? 'auto' : 'none',
    }}>
      <div onClick={onClose} style={{
        position: 'absolute', inset: 0, background: 'rgba(12,35,64,0.4)',
        opacity: open ? 1 : 0, transition: 'opacity 0.28s',
      }} />
      <div style={{
        position: 'absolute', left: 0, right: 0, bottom: 0,
        background: '#F7F6F2', borderRadius: '22px 22px 0 0',
        transform: open ? 'translateY(0)' : 'translateY(105%)',
        transition: 'transform 0.32s cubic-bezier(0.32, 0.72, 0, 1)',
        boxShadow: '0 -8px 40px rgba(12,35,64,0.18)',
        paddingBottom: 14,
      }}>
        <div style={{ display: 'flex', justifyContent: 'center', padding: '9px 0 2px' }}>
          <div style={{ width: 38, height: 5, borderRadius: 3, background: '#D6D4CC' }} />
        </div>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '6px 18px 10px' }}>
          <span style={{ fontSize: 14, fontWeight: 700, color: C.text }}>Menu khác</span>
          <button onClick={onClose} style={{ width: 28, height: 28, borderRadius: 14, border: 'none', background: '#EAE8E1', color: '#666', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>
            <Ic d={icons.x} size={14} sw={2.2} />
          </button>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8, padding: '0 16px' }}>
          {rest.map(m => (
            <button key={m.id} onClick={() => onNavigate(m.id)} style={{
              display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6,
              padding: '12px 2px 10px', background: '#fff', border: `1px solid ${C.border}`,
              borderRadius: 14, cursor: 'pointer', color: C.navy,
            }}>
              <Ic d={icons[m.icon]} size={21} />
              <span style={{ fontSize: 10, color: '#444', fontWeight: 500 }}>{m.label}</span>
            </button>
          ))}
        </div>
        <button onClick={onCustomize} style={{
          display: 'flex', alignItems: 'center', gap: 10, width: 'calc(100% - 32px)',
          margin: '12px 16px 0', padding: '12px 14px', background: '#fff',
          border: `1px solid ${C.border}`, borderRadius: 14, cursor: 'pointer',
        }}>
          <span style={{ width: 30, height: 30, borderRadius: 9, background: '#E6F1FB', color: C.blue, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <Ic d={icons.sliders} size={16} />
          </span>
          <span style={{ flex: 1, textAlign: 'left' }}>
            <div style={{ fontSize: 12.5, fontWeight: 600, color: C.text }}>Tuỳ chỉnh thanh điều hướng</div>
            <div style={{ fontSize: 10.5, color: C.mut }}>Chọn 4 mục hay dùng nhất của bạn</div>
          </span>
          <span style={{ color: '#bbb' }}><Ic d={icons.chevR} size={16} /></span>
        </button>
      </div>
    </div>
  );
}

/* ═══════════ Màn Tuỳ chỉnh bottom nav ═══════════ */
function CustomizeScreen({ pinned, setPinned, onBack, toast }) {
  const rest = MENU.filter(m => !pinned.includes(m.id));
  const unpin = id => setPinned(pinned.filter(p => p !== id));
  const pin = id => {
    if (pinned.length >= 4) { toast('Tối đa 4 mục — bỏ ghim một mục trước'); return; }
    setPinned([...pinned, id]);
  };
  return (
    <div style={{ background: C.bg, minHeight: '100%' }}>
      <div style={{ position: 'sticky', top: 0, zIndex: 5, display: 'flex', alignItems: 'center', gap: 8, padding: '10px 12px', background: 'rgba(240,239,233,0.92)', backdropFilter: 'blur(12px)', borderBottom: `1px solid ${C.border}` }}>
        <button onClick={onBack} style={{ width: 32, height: 32, borderRadius: 10, border: 'none', background: 'transparent', color: C.blue, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>
          <Ic d={icons.chevL} size={20} sw={2.2} />
        </button>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 15, fontWeight: 700, color: C.text }}>Tuỳ chỉnh điều hướng</div>
        </div>
        <button onClick={onBack} style={{ padding: '7px 16px', fontSize: 12.5, fontWeight: 600, color: '#fff', background: C.blue, border: 'none', borderRadius: 10, cursor: 'pointer' }}>Xong</button>
      </div>

      <div style={{ padding: '14px 16px' }}>
        <div style={{ fontSize: 11, fontWeight: 600, color: C.mut, letterSpacing: '0.04em', marginBottom: 8 }}>
          ĐANG GHIM · {pinned.length}/4
        </div>
        <div style={{ background: '#fff', border: `1px solid ${C.border}`, borderRadius: 14, overflow: 'hidden', marginBottom: 18 }}>
          {pinned.map((id, i) => {
            const m = menuOf(id);
            return (
              <div key={id} style={{ display: 'flex', alignItems: 'center', gap: 11, padding: '11px 13px', borderTop: i ? `1px solid ${C.grid}` : 'none' }}>
                <span style={{ color: '#C9C7BF' }}><Ic d={icons.grip} size={17} /></span>
                <span style={{ width: 32, height: 32, borderRadius: 10, background: '#E6F1FB', color: C.blue, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <Ic d={icons[m.icon]} size={17} />
                </span>
                <span style={{ flex: 1, fontSize: 13, fontWeight: 600, color: C.text }}>{m.label}</span>
                <button onClick={() => unpin(id)} style={{ width: 26, height: 26, borderRadius: 13, border: 'none', background: '#FCEBEB', color: '#DC2626', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>
                  <Ic d={icons.minus} size={14} sw={2.4} />
                </button>
              </div>
            );
          })}
          {!pinned.length && <div style={{ padding: 18, fontSize: 12, color: C.mut2, textAlign: 'center' }}>Chưa ghim mục nào</div>}
        </div>

        <div style={{ fontSize: 11, fontWeight: 600, color: C.mut, letterSpacing: '0.04em', marginBottom: 8 }}>MENU KHÁC</div>
        <div style={{ background: '#fff', border: `1px solid ${C.border}`, borderRadius: 14, overflow: 'hidden' }}>
          {rest.map((m, i) => (
            <div key={m.id} style={{ display: 'flex', alignItems: 'center', gap: 11, padding: '11px 13px', borderTop: i ? `1px solid ${C.grid}` : 'none' }}>
              <span style={{ width: 32, height: 32, borderRadius: 10, background: '#F1EFE8', color: '#5F5E5A', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <Ic d={icons[m.icon]} size={17} />
              </span>
              <span style={{ flex: 1, fontSize: 13, fontWeight: 500, color: C.text }}>{m.label}</span>
              <button onClick={() => pin(m.id)} style={{
                display: 'flex', alignItems: 'center', gap: 4, padding: '5px 11px',
                fontSize: 11, fontWeight: 600, borderRadius: 9, cursor: 'pointer',
                border: `1px solid ${pinned.length >= 4 ? C.border : '#B5D4F4'}`,
                background: pinned.length >= 4 ? '#F7F6F2' : '#E6F1FB',
                color: pinned.length >= 4 ? '#B4B2A9' : C.blue,
              }}>
                <Ic d={icons.pin} size={12} /> Ghim
              </button>
            </div>
          ))}
        </div>
        <div style={{ fontSize: 10.5, color: C.mut2, marginTop: 12, lineHeight: 1.6, textAlign: 'center' }}>
          Thanh điều hướng cập nhật ngay khi bạn ghim/bỏ ghim.<br />Lưu theo tài khoản — mở máy nào cũng giữ nguyên.
        </div>
      </div>
    </div>
  );
}

/* ═══════════ AppPhone — mỗi máy 1 state machine độc lập ═══════════ */
function AppPhone({ initialTab = 'reports', initialDrawer = false, initialCustomize = false }) {
  const [pinned, setPinned] = React.useState(DEFAULT_PINNED);
  const [tab, setTab] = React.useState(initialTab);
  const [drawer, setDrawer] = React.useState(initialDrawer);
  const [customize, setCustomize] = React.useState(initialCustomize);
  const [toastMsg, setToastMsg] = React.useState('');
  const toast = msg => { setToastMsg(msg); setTimeout(() => setToastMsg(''), 2200); };

  const navigate = id => { setTab(id); setDrawer(false); setCustomize(false); };

  return (
    <IosFrame time="9:41" battery={82}>
      <div style={{ position: 'relative', height: '100%', display: 'flex', flexDirection: 'column', fontFamily: "'Inter', -apple-system, sans-serif" }}>
        <div style={{ flex: 1, overflowY: 'auto', overflowX: 'hidden' }}>
          {customize
            ? <CustomizeScreen pinned={pinned} setPinned={setPinned} onBack={() => setCustomize(false)} toast={toast} />
            : tab === 'reports'
              ? <ReportsScreen />
              : <PlaceholderScreen label={menuOf(tab)?.label || tab} />}
        </div>
        {!customize && (
          <BottomNav pinned={pinned} active={tab} moreActive={drawer}
            onTab={navigate} onMore={() => setDrawer(true)} />
        )}
        <MoreDrawer open={drawer} pinned={pinned} onClose={() => setDrawer(false)}
          onNavigate={navigate} onCustomize={() => { setDrawer(false); setCustomize(true); }} />
        {toastMsg && (
          <div style={{
            position: 'absolute', bottom: 90, left: '50%', transform: 'translateX(-50%)',
            background: 'rgba(17,17,17,0.92)', color: '#fff', fontSize: 11.5,
            padding: '9px 16px', borderRadius: 12, whiteSpace: 'nowrap', zIndex: 50,
          }}>{toastMsg}</div>
        )}
      </div>
    </IosFrame>
  );
}

/* ═══════════ Canvas: 3 máy song song ═══════════ */

    { label: '① Báo cáo — bản mobile (bấm thử tab, filter)', props: {} },

    { label: '③ Tuỳ chỉnh thanh điều hướng (ghim / bỏ ghim thật)', props: { initialCustomize: true } },
  ];
  return (
    <div className="canvas">
      <div style={{ maxWidth: 1400, margin: '0 auto' }}>
        <div style={{ marginBottom: 28 }}>
          <div style={{ fontSize: 21, fontWeight: 700, color: C.navy, letterSpacing: '-0.01em' }}>Let's Go VN — Demo giao diện mobile</div>
          <div style={{ fontSize: 13, color: '#77756E', marginTop: 5 }}>
            Cả 3 máy đều thao tác được thật: chuyển tab, mở menu ⋯, ghim/bỏ ghim điều hướng. Số liệu lấy từ app, shape biểu đồ minh hoạ.
          </div>

        <div style={{ display: 'flex', gap: 36, flexWrap: 'wrap', alignItems: 'flex-start' }}>
          {screens.map(s => (

/* ─── IosFrame (assets/ios_frame.jsx — iPhone 15 Pro chuẩn) ─── */
/**
 * IosFrame — iPhone设备边框
 *
 * 参考iPhone 15 Pro（393×852 logical pixels）
 * 含：灵动岛 + 状态栏（时间/信号/电池）+ Home Indicator + 圆角
 *
 * 用法：
 *   <IosFrame time="9:41" battery={85}>
 *     <YourAppContent />
 *   </IosFrame>
 *
 * 自定义：
 *   <IosFrame width={390} height={844} darkMode showKeyboard>
 *     ...
 *   </IosFrame>
 */

const iosFrameStyles = {
  wrapper: {
    display: 'inline-block',
    padding: 12,
    background: '#000',
    borderRadius: 60,
    boxShadow: '0 0 0 2px #1f2937, 0 20px 60px rgba(0,0,0,0.3)',
    position: 'relative',
  },
  screen: {
    position: 'relative',
    borderRadius: 48,
    overflow: 'hidden',
    background: '#fff',
  },
  statusBar: {
    position: 'absolute',
    top: 0,
    left: 0,
    right: 0,
    height: 54,
    display: 'flex',
    alignItems: 'center',
    justifyContent: 'space-between',
    padding: '0 32px 0 32px',
    fontSize: 16,
    fontWeight: 600,
    fontFamily: '-apple-system, "SF Pro Text", sans-serif',
    zIndex: 20,
    pointerEvents: 'none',
  },
  dynamicIsland: {
    position: 'absolute',
    top: 12,
    left: '50%',
    transform: 'translateX(-50%)',
    width: 124,
    height: 36,
    background: '#000',
    borderRadius: 999,
    zIndex: 30,
  },
  statusIcons: {
    display: 'flex',
    alignItems: 'center',
    gap: 6,
  },
  signalIcon: {
    display: 'flex',
    alignItems: 'flex-end',
    gap: 2,
    height: 12,
  },
  signalBar: {
    width: 3,
    background: 'currentColor',
    borderRadius: 1,
  },
  wifiIcon: {
    width: 16,
    height: 12,
    position: 'relative',
  },
  batteryIcon: {
    width: 26,
    height: 12,
    border: '1.5px solid currentColor',
    borderRadius: 3,
    padding: 1,
    position: 'relative',
    opacity: 0.8,
  },
  batteryCap: {
    position: 'absolute',
    top: 3,
    right: -3,
    width: 2,
    height: 6,
    background: 'currentColor',
    borderRadius: '0 1px 1px 0',
  },
  content: {
    position: 'absolute',
    top: 54,
    left: 0,
    right: 0,
    bottom: 34,
    overflow: 'auto',
  },
  homeIndicator: {
    position: 'absolute',
    bottom: 10,
    left: '50%',
    transform: 'translateX(-50%)',
    width: 140,
    height: 5,
    background: 'rgba(0,0,0,0.3)',
    borderRadius: 999,
    zIndex: 10,
  },
  homeIndicatorDark: {
    background: 'rgba(255,255,255,0.5)',
  },
};

function IosFrame({
  children,
  width = 393,
  height = 852,
  time = '9:41',
  battery = 100,
  darkMode = false,
  showStatusBar = true,
  showDynamicIsland = true,
  showHomeIndicator = true,
}) {
  const textColor = darkMode ? '#fff' : '#000';

  return (
    <div style={iosFrameStyles.wrapper}>
      <div style={{
        ...iosFrameStyles.screen,
        width,
        height,
        background: darkMode ? '#000' : '#fff',
      }}>
        {showStatusBar && (
          <div style={{ ...iosFrameStyles.statusBar, color: textColor }}>
            <span>{time}</span>
            <div style={iosFrameStyles.statusIcons}>
              <div style={iosFrameStyles.signalIcon}>
                <div style={{ ...iosFrameStyles.signalBar, height: 4 }} />
                <div style={{ ...iosFrameStyles.signalBar, height: 6 }} />
                <div style={{ ...iosFrameStyles.signalBar, height: 9 }} />
                <div style={{ ...iosFrameStyles.signalBar, height: 11 }} />
              </div>
              <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style={{ color: textColor }}>
                <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
                <path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" />
                <path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.7" />
              </svg>
              <div style={iosFrameStyles.batteryIcon}>
                <div style={{
                  width: `${battery}%`,
                  height: '100%',
                  background: 'currentColor',
                  borderRadius: 1,
                  opacity: 0.9,
                }} />
                <div style={iosFrameStyles.batteryCap} />
              </div>
            </div>
          </div>
        )}

        {showDynamicIsland && <div style={iosFrameStyles.dynamicIsland} />}

        <div style={iosFrameStyles.content}>
          {children}
        </div>

        {showHomeIndicator && (
          <div style={{
            ...iosFrameStyles.homeIndicator,
            ...(darkMode ? iosFrameStyles.homeIndicatorDark : {}),
          }} />
        )}
      </div>
    </div>
  );
}

if (typeof window !== 'undefined') {
  window.IosFrame = IosFrame;
}


ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
